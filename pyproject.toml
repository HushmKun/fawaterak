[project]
name = "fawaterak" 
version = "0.2.0"
description = "Python bindings for the Fawaterak API"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Hussein Mukhtar", email = "hussein@hushm.me" }]
license-files = ["LICENSE"]
license = "AGPL-3.0-or-later"
keywords = ["fawaterk", "api", "payments"]

classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "oauthlib>=3.3.1",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "requests-oauthlib>=2.0.0",
    "urllib3>=2.6.3",
]

[dependency-groups]
dev = [
    "cov>=0.1.2",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.1.5",
    "requests-mock>=1.12.0",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

# [project.optional-dependencies]
# async = ["httpx"]

[project.urls]
source = "https://github.com/HushmKun/fawaterak"
issues = "https://github.com/HushmKun/fawaterak/issues"
changelog = "https://github.com/HushmKun/fawaterak/blob/master/CHANGELOG.md"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
exclude = [
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]
line-length = 88
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["I"] 
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "integration: live tests that hit the Fawaterak staging API (requires real credentials)",
]
