name: CI

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Test (pytest) with coverage
        run: uv run pytest --cov

      # Runs even when the threshold fails the step above, so the summary
      # shows which lines are missing.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .coverage ]; then
            echo "### Coverage on Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
            uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build wheel
        run: uv build --wheel --out-dir dist


      - name: Import the wheel in a clean environment
        working-directory: ${{ runner.temp }}
        run: |
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl python -I - <<'EOF'
          import importlib.resources
          import sys

          import fawaterak

          assert "site-packages" in fawaterak.__file__, f"imported from {fawaterak.__file__}"
          assert importlib.resources.files("fawaterak").joinpath("py.typed").is_file(), "py.typed is missing from the wheel"
          print(f"fawaterak {fawaterak.__version__} imports cleanly on Python {sys.version.split()[0]}")
          EOF
