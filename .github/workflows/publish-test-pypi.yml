name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  id-token: write      
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build
      - run: uv publish --index testpypi --trusted-publishing always